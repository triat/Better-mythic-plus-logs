<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.5; }
    a { color: #58a6ff; text-decoration: none; } a:hover { color: #79b8ff; }
  </style>
</helmet>
<div style="width: 1440px; min-height: 720px; background: #0d1117; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid #21262d;">
    <div style="font-weight: 700; font-size: 15px; color: #e6edf3;">bmpl</div>
    <div style="flex: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px; color: #8b949e; font-size: 13px;">
      <div style="width: 30px; height: 18px; border-radius: 999px; background: #30363d; position: relative;"><div style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #8b949e;"></div></div>
      <span>Clipboard watch off</span>
    </div>
    <div style="border: 1px solid #30363d; color: #8b949e; font-size: 13px; padding: 0 12px; height: 32px; display: flex; align-items: center; border-radius: 6px;">Quit</div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
    <div style="font-size: 26px; font-weight: 700; color: #ffffff;">Who applied to your key?</div>
    <div style="font-size: 14px; color: #8b949e;">Paste a Name-Realm or a Raider.IO character URL</div>
    <div style="display: flex; gap: 8px; width: 680px;">
      <div style="display: flex; align-items: center; gap: 10px; flex: 1; background: #0b0f14; border: 1px solid #58a6ff; border-radius: 8px; padding: 0 14px; height: 48px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <div style="flex: 1; color: #6e7681; font-size: 16px;">Name-Realm<span style="color: #58a6ff;">|</span></div>
      </div>
      <div style="background: #238636; color: #ffffff; font-size: 15px; font-weight: 600; padding: 0 20px; height: 48px; display: flex; align-items: center; border-radius: 6px;">Look up</div>
    </div>
    <div style="display: flex; gap: 10px; font-size: 12px; color: #8b949e;">
      <span style="border: 1px solid #30363d; border-radius: 999px; padding: 2px 10px;">Target level: auto</span>
      <span style="border: 1px solid #30363d; border-radius: 999px; padding: 2px 10px;">Spec: any</span>
      <span style="border: 1px solid #30363d; border-radius: 999px; padding: 2px 10px;">Metric: auto</span>
    </div>
    <div style="margin-top: 16px; font-size: 12px; color: #6e7681;">Turn on clipboard watch and copy a name in-game — the lookup runs by itself.</div>
  </div>
</div>
</x-dc>
</body>
</html>
