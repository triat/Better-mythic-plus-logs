# The dashboards come from the repository (deploy/grafana/dashboards, installed by bootstrap.sh): read-only in the UI,
# so a change is a pull request, never a hand edit on the server.
apiVersion: 1
providers:
  - name: bmpl
    orgId: 1
    folder: bmpl
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards/bmpl
