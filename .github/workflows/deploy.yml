# Deploy a GitHub release to the VPS. Triggered when a release is published (or by hand), never by a
# push to main: main is where work happens, a release is the decision to ship it.
# Secrets: BMPL_DEPLOY_SSH_KEY (private key authorised for the `deploy` user), BMPL_DEPLOY_KNOWN_HOSTS
# (the VPS host key, from `ssh-keyscan -t ed25519 <ip>`). Variables: BMPL_DEPLOY_HOST (deploy@<ip>),
# BMPL_PUBLIC_URL (https://bmpl.<domain>). See deploy/README.md § 9.
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: extractions/setup-just@v2

      # A release tag must be the version the binary will report (/api/health, the admin page).
      - name: Check the release tag against package.json
        if: github.event_name == 'release'
        run: |
          v="v$(jq -r .version package.json)"
          test "$v" = "${{ github.event.release.tag_name }}" || { echo "package.json says $v, release tag is ${{ github.event.release.tag_name }}"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd web
      - run: just check
      # No .env in CI: every test runs on fakes; nothing reaches Warcraft Logs or Raider.IO.
      - run: bun test
      - run: just build-linux

      - name: Ship the binary and restart bmpl
        env:
          DEPLOY_HOST: ${{ vars.BMPL_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BMPL_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.BMPL_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes dist/bmpl-linux "$DEPLOY_HOST:/home/deploy/bmpl.new"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_HOST" 'sudo -n install -o bmpl -g bmpl -m 755 /home/deploy/bmpl.new /opt/bmpl/bmpl && rm /home/deploy/bmpl.new && sudo -n systemctl restart bmpl && for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && { echo "bmpl is up"; exit 0; }; sleep 1; done; echo "bmpl did not answer /api/health in 30 s" >&2; journalctl -u bmpl -n 30 --no-pager; exit 1'

      - name: Public health check
        run: |
          out=$(curl -fsS --max-time 15 "${{ vars.BMPL_PUBLIC_URL }}/api/health")
          echo "$out"
          echo "$out" | jq -e --arg v "$(jq -r .version package.json)" '.ok and .version == $v' >/dev/null
