<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(Geist-Variable.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:GeistMono;src:url(GeistMono-Variable.woff2) format("woff2");font-weight:100 900}
html,body{margin:0}
.c{width:1200px;height:630px;box-sizing:border-box;padding:64px 84px 60px;background:#0e1014;color:#eceef2;font-family:Geist,sans-serif;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-200px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,#16202a,transparent);}
.top{display:flex;align-items:center;gap:40px}
.logo{display:inline-flex;flex-direction:column;align-items:center;gap:20px;line-height:1}
.word{font-size:120px;font-weight:800;letter-spacing:-.04em}
.dots{display:flex;gap:24px}.dots i{width:31px;height:31px;border-radius:50%;background:#3fcf8e}.dots i:nth-child(2){background:#f2b544}.dots i:nth-child(3){background:#f2665c}
.kicker{font-size:26px;color:#a0a7b4;letter-spacing:.02em}
h1{margin:0;font-size:60px;line-height:1.08;font-weight:700;letter-spacing:-.02em;max-width:960px}
.sub{font-size:28px;color:#c9ced8;line-height:1.35;max-width:930px;margin-top:18px}
.foot{display:flex;align-items:center;gap:16px}
.chip{font-family:GeistMono,monospace;font-size:24px;font-weight:600;padding:8px 18px;border-radius:999px;border:2px solid}
.inv{color:#3fcf8e;background:#12201b;border-color:#24523f}.may{color:#f2b544;background:#1a1812;border-color:#3d3420}.pas{color:#f2665c;background:#1e1416;border-color:#4a2228}
.src{margin-left:auto;font-size:24px;color:#8d95a3}
</style></head><body><div class="c">
<div class="top"><span class="logo"><span class="word">bmpl</span><span class="dots"><i></i><i></i><i></i></span></span><span class="kicker">Better Mythic+ Logs<br>World of Warcraft</span></div>
<div><h1>Vet a Mythic+ applicant in a few seconds.</h1><div class="sub">Their Warcraft Logs and Raider.IO against players of their spec, at your key level.</div></div>
<div class="foot"><span class="chip inv">INVITE</span><span class="chip may">MAYBE</span><span class="chip pas">PASS</span><span class="src">Warcraft Logs · Raider.IO</span></div>
</div></body></html>
