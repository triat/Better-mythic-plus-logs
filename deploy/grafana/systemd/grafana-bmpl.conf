# Drop-in for the grafana-server unit of Grafana's .deb (installed as
# /etc/systemd/system/grafana-server.service.d/bmpl.conf). Settings as GF_* variables, so grafana.ini stays the package's.
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3001
Environment=GF_SERVER_ENFORCE_DOMAIN=true
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_SECURITY_COOKIE_SECURE=true
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
# GF_SERVER_DOMAIN, GF_SERVER_ROOT_URL, GF_SECURITY_ADMIN_PASSWORD and DISCORD_ALERT_WEBHOOK: never in the repository.
EnvironmentFile=/etc/grafana/grafana.env
# Measured at ~400 MB with the VictoriaLogs plugin; the cap keeps it from starving bmpl.
MemoryMax=768M
